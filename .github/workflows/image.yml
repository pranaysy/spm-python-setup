# Build the container image and publish it to ghcr.io/<owner>/<repo>.
#
# A version tag (git tag v1.2 && git push origin v1.2) publishes the image as
# "1.2" and "latest". A manual run (Actions tab > Run workflow) publishes it
# only as "sha-<commit>", for testing before a release.

name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io
  id-token: write # sign the provenance attestation
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # The build needs about 18 GB at its peak (5 GB runtime zip, unpacked
      # installer, installed runtime, image). Remove preinstalled toolchains
      # that the build does not use, to make room.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags: the git tag without its "v" (latest is added for these),
      # and sha-<commit> for every run.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=sha

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          # zstd layers instead of gzip, 20% less to download
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
